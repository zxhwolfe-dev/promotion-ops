name: verification-contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Public dependency lockfile bootstrap (temporary)
        run: |
          echo 'PROMO_LOCKFILE_BEGIN'
          cat package-lock.json
          echo 'PROMO_LOCKFILE_END'
      - run: npm run check
      - run: npx playwright-core install --with-deps chromium
      - name: Unit tests and isolated browser contracts (no production credentials)
        run: |
          export PROMO_TEST_BROWSER="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")"
          npm test
